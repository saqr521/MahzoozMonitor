name: Build APK - الإصدار 4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: استخراج المشروع
        shell: bash
        run: |
          mkdir -p final_project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "ملف المشروع: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d final_project

      - name: العثور على Gradle وتشغيل البناء
        shell: bash
        run: |
          GRADLEW=$(find final_project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "لم يتم العثور على gradlew"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-FINAL-v4-APK
          path: |
            final_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
