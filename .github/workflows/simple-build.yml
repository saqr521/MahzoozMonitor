name: Simple Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: فك ملف المشروع
        run: |
          unzip -q MahzoozMonitor-Pro-FIXED-v3.1-source.zip -d project

          echo "=== البحث عن ملفات Gradle ==="
          find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: بناء APK
        run: |
          echo "=== البحث عن جذر مشروع Gradle ==="

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "❌ لم يتم العثور على settings.gradle"
            echo "=== محتويات المشروع ==="
            find project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "✅ جذر Gradle: $PROJECT"

          cd "$PROJECT"

          echo "=== ملفات جذر المشروع ==="
          ls -la

          echo "=== تشغيل Gradle ==="
          gradle --no-daemon assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-Pro-Final
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
