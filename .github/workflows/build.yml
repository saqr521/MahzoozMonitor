name: Build Mahzooz v45

on:
  workflow_dispatch:
  push:
    paths:
      - "MahzoozMonitor-v45-Live-Grid-Reader.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find v45 Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./MahzoozMonitor-v45-Live-Grid-Reader.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: v45 project ZIP was not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "ZIP files in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found v45 project ZIP:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract v45 Project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          GRADLEW=$(find project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the v45 project ZIP"
            find project -maxdepth 6 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "v45 Gradle wrapper:"
          echo "$GRADLEW"

          echo "v45 Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "Android SDK:"
          echo "$SDK_DIR"

          if [ ! -d "$SDK_DIR" ]; then
            echo "ERROR: Android SDK directory not found"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Installed Android platforms:"
          ls -1 "$SDK_DIR/platforms" 2>/dev/null || true

          echo ""
          echo "Installed build tools:"
          ls -1 "$SDK_DIR/build-tools" 2>/dev/null || true

      - name: Check v45 Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "Gradle wrapper version:"
          ./gradlew --version

      - name: Build Mahzooz v45 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "Building Mahzooz v45..."
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify v45 APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Mahzooz v45 APK was not generated"

            echo ""
            echo "Available output files:"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true

            exit 1
          fi

          echo "Mahzooz v45 APK successfully generated:"
          ls -lh "$APK"

      - name: Prepare Final v45 APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            output/MahzoozMonitor-Pro-v45-debug.apk

          echo "Final APK:"
          ls -lh output/MahzoozMonitor-Pro-v45-debug.apk

      - name: Upload Mahzooz v45 APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-Pro-v45-debug
          path: output/MahzoozMonitor-Pro-v45-debug.apk
          if-no-files-found: error
