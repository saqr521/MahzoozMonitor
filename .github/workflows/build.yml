name: Build Mahzooz

on:
  workflow_dispatch:
  push:
    paths:
      - "Mahzooz.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Mahzooz ZIP
        run: |
          test -f "./Mahzooz.zip"
          echo "Mahzooz.zip found successfully."

      - name: Extract Mahzooz project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "./Mahzooz.zip" -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build Mahzooz
        working-directory: .
        run: |
          echo "Building Mahzooz..."
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "${PROJECT_DIR}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Debug APK was not found."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Mahzooz-debug.apk

          echo "APK created:"
          ls -lh output/Mahzooz-debug.apk

      - name: Upload Mahzooz APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahzooz-debug-apk
          path: output/Mahzooz-debug.apk
          if-no-files-found: error
