name: Build APK - FINAL v4

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare FINAL v4 source
        run: |
          rm -rf final_project
          mkdir final_project
          unzip -q MahzoozMonitor-Pro-FINAL-v4-source.zip -d final_project
          test -f final_project/settings.gradle.kts
          test -f final_project/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: final_project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-Pro-FINAL-v4-debug
          path: final_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
