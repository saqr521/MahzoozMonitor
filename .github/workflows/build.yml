name: Build Mahzooz FINAL TOUCH FIX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "Mahzooz-FINAL-TOUCH-FIX.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: mahzooz-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and Unpack Mahzooz FINAL TOUCH FIX
        shell: bash
        run: |
          set -euo pipefail

          ZIP="./Mahzooz-FINAL-TOUCH-FIX.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Mahzooz-FINAL-TOUCH-FIX.zip was not found"
            exit 1
          fi

          rm -rf .mahzooz-unpacked
          mkdir -p .mahzooz-unpacked

          unzip -q "$ZIP" -d .mahzooz-unpacked

          if [ ! -f ".mahzooz-unpacked/gradlew" ]; then
            echo "gradlew was not found inside the project ZIP"
            exit 1
          fi

          if [ ! -f ".mahzooz-unpacked/settings.gradle.kts" ]; then
            echo "settings.gradle.kts was not found"
            exit 1
          fi

          if [ ! -d ".mahzooz-unpacked/app" ]; then
            echo "app folder was not found"
            exit 1
          fi

          cp -a .mahzooz-unpacked/. .
          rm -rf .mahzooz-unpacked

          chmod +x ./gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare OCR data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tessdata

          curl -fsSL --retry 3 \
            -o app/src/main/assets/tessdata/ara.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/ara.traineddata

          curl -fsSL --retry 3 \
            -o app/src/main/assets/tessdata/eng.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata

          test -s app/src/main/assets/tessdata/ara.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata

      - name: Build Mahzooz FINAL TOUCH FIX
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Mahzooz FINAL TOUCH FIX..."

          chmod +x ./gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Mahzooz-FINAL-TOUCH-FIX-debug.apk

          ls -lh output/Mahzooz-FINAL-TOUCH-FIX-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahzooz-FINAL-TOUCH-FIX-debug-apk
          path: output/Mahzooz-FINAL-TOUCH-FIX-debug.apk
          if-no-files-found: error
