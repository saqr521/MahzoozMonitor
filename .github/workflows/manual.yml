name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle.dcl" \
          \) \
          -not -path "./.git/*" \
          -not -path "./_extracted/*" \
          -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "No Gradle project found in repository."
            echo "Checking for ZIP files..."

            mkdir -p _extracted

            FOUND_ZIP=false

            while IFS= read -r ZIP; do
              echo "Extracting: $ZIP"
              unzip -q -o "$ZIP" -d _extracted
              FOUND_ZIP=true
            done < <(find . -maxdepth 3 -type f -name "*.zip" -not -path "./.git/*")

            if [ "$FOUND_ZIP" = true ]; then
              SETTINGS=$(find ./_extracted -type f \( \
                -name "settings.gradle" -o \
                -name "settings.gradle.kts" -o \
                -name "settings.gradle.dcl" \
              \) -print -quit)
            fi
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "======================================"
          echo "Gradle project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project
        shell: bash
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo ""
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo "Files:"
          ls -la

          if [ -f "./gradlew" ]; then
            echo "Using Gradle Wrapper"
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Using installed Gradle"
            gradle --no-daemon assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_DIR" -type f -name "*-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
