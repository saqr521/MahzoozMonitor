name: Build FINAL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          unzip -o MahzoozMonitor-Pro-FINAL-v3.1.zip -d final_project

      - name: Build APK
        working-directory: final_project/MahzoozMonitor-Pro
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-FINAL-v3.1
          path: final_project/MahzoozMonitor-Pro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
