name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."

          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            echo "=== Project files ==="
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "Gradle project: $PROJECT"

          cd "$PROJECT"

          echo "=== Project files ==="
          ls -la

          echo "=== Building APK ==="
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-Pro-Final
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
