name: Simple Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: فك المشروع
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "❌ لم يتم العثور على ملف ZIP للمشروع"
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "=== ملفات Gradle ==="
          find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: تحديد مجلد المشروع
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "❌ لم يتم العثور على settings.gradle"
            echo "محتويات المشروع:"
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ مجلد المشروع: $PROJECT_DIR"

      - name: بناء APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== محتويات المشروع ==="
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "⚠️ لا يوجد Gradle Wrapper، سيتم استخدام Gradle النظام"
            gradle --no-daemon assembleDebug
          fi

      - name: البحث عن APK
        shell: bash
        run: |
          echo "=== APK الناتج ==="
          find . -type f -name "*.apk" -print

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-Pro-Final
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
