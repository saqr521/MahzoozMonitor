name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=-find . -maxdepth 2 -type f -name ".zip" | head -n 1
          if -z "ZIP_FILE" ; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          mkdir extracted
          unzip -q "ZIP_FILE" -d extracted
          
          # البحث عن المجلد الذي يحتوي على إعدادات المشروع
          PROJECT_DIR=(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -n 1)
          if [ -z "PROJECT_DIR" ; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi
          echo "PROJECT_DIR=PROJECT_DIR" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: |
          cd env.PROJECT_DIR 
          chmod +x gradlew

      - name: Build APK
        run: |
          cd env.PROJECT_DIR 
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: env.PROJECT_DIR /app/build/outputs/apk/debug/.apk
          
