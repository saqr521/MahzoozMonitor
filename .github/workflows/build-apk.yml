name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias mahzooz \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mahzooz123 \
            -keypass mahzooz123 \
            -dname "CN=MahzoozMonitor, OU=App, O=Mahzooz, L=Egypt, C=EG"

      - name: Sign APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          "$ZIPALIGN" -f 4 "$APK" aligned.apk

          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-pass pass:mahzooz123 \
            --key-pass pass:mahzooz123 \
            --out MahzoozMonitor-release.apk \
            aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-release
          path: MahzoozMonitor-release.apk
