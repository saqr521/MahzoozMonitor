name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create Kotlin fix
        shell: bash
        run: |
          cat > "$HOME/kotlin-fix.gradle" <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle.dcl" \
          \) -not -path "./.git/*" -print -quit)

          if [ -z "$SETTINGS" ]; then
            mkdir -p _extracted

            while IFS= read -r ZIP; do
              echo "Extracting $ZIP"
              unzip -q -o "$ZIP" -d _extracted
            done < <(find . -maxdepth 3 -type f -name "*.zip" -not -path "./.git/*")

            SETTINGS=$(find ./_extracted -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "settings.gradle.dcl" \
            \) -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found at: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew \
              --no-daemon \
              --init-script "$HOME/kotlin-fix.gradle" \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --init-script "$HOME/kotlin-fix.gradle" \
              assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_DIR" -type f -name "*-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
