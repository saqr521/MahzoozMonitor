on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root"
            echo "ZIP files in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found project ZIP:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          GRADLEW=$(find project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside project ZIP"
            find project -maxdepth 5 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "Android SDK:"
          echo "$SDK_DIR"

          if [ ! -d "$SDK_DIR" ]; then
            echo "ERROR: Android SDK directory not found"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"

          echo "Installed Android platforms:"
          ls -1 "$SDK_DIR/platforms" 2>/dev/null || true

          echo "Installed build tools:"
          ls -1 "$SDK_DIR/build-tools" 2>/dev/null || true

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"

            echo "Available output files:"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            output/Mahzooz-debug.apk

          ls -lh output/Mahzooz-debug.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahzooz-debug-apk
          path: output/Mahzooz-debug.apk
          if-no-files-found: error
