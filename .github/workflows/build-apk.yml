name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q MahzoozMonitor_v1-20_FIXED_displaymetrics.zip
          cd MahzoozMonitor_v1-20_FIXED_displaymetrics/MahzoozMonitor_Complete
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-debug-apk
          path: MahzoozMonitor_v1-20_FIXED_displaymetrics/MahzoozMonitor_Complete/app/build/outputs/apk/debug/app-debug.apk
