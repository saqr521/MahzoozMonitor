name: Simple Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: فك المشروع
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -1)

          if [ -z "$ZIP" ]; then
            echo "❌ لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "📦 الملف: $ZIP"

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          echo "=== بنية المشروع ==="
          find project -maxdepth 5 -type f \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "settings.gradle.dcl" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

      - name: تحديد جذر Gradle
        shell: bash
        run: |
          set -e

          ROOT=""

          WRAPPER=$(find project -type f -name "gradlew" | head -1)

          if [ -n "$WRAPPER" ]; then
            ROOT=$(dirname "$WRAPPER")
          else
            SETTINGS=$(find project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "settings.gradle.dcl" \) \
              | head -1)

            if [ -n "$SETTINGS" ]; then
              ROOT=$(dirname "$SETTINGS")
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "❌ لم أجد جذر مشروع Gradle"
            exit 1
          fi

          echo "✅ جذر Gradle: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: بناء APK
        shell: bash
        run: |
          set -e

          cd "$ROOT"

          echo "=== داخل ==="
          pwd

          echo "=== الملفات ==="
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: البحث عن APK
        shell: bash
        run: |
          echo "=== APK ==="
          find . -type f -name "*.apk" -print

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: MahzoozMonitor-Pro-Final
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
